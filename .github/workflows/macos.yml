# Builds the native macOS app (Apple Silicon) and uploads a self-contained zip:
# Homebrew dylibs are copied into the bundle so it runs without Homebrew installed.
# Game assets are never part of the build; players pass their own with --assets.
# A pushed v* tag also publishes the zip as a GitHub Release; every push to steam-ogg-support
# replaces the rolling prerelease steam-ogg-support-latest.
name: macOS build

on:
  push:
    branches: [main, steam-ogg-support]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload/delete

# A newer push to the same branch supersedes a running build (and its rolling release).
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS 14 bottles keep the app runnable on Sonoma and later.
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      APP: build/mac-native/rich4-portable.app
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install sdl3 freetype dylibbundler

      - name: Configure
        run: >
          cmake -S . -B build/mac-native -DCMAKE_BUILD_TYPE=Release
          -DRICH4_SANITIZERS=OFF -DRICH4_BUILD_VIEWER=OFF -DRICH4_BUILD_GAME=ON -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/mac-native --target rich4-portable --parallel

      - name: Bundle dylibs
        run: |
          dylibbundler --bundle-deps --overwrite-dir --create-dir \
            --fix-file "$APP/Contents/MacOS/rich4-portable" \
            --dest-dir "$APP/Contents/Frameworks" \
            --install-path @executable_path/../Frameworks/
          # Fail if anything still points into Homebrew.
          if otool -L "$APP/Contents/MacOS/rich4-portable" "$APP"/Contents/Frameworks/*.dylib | grep -E '/(opt|usr/local)/'; then
            echo "Unbundled Homebrew dependency found" >&2
            exit 1
          fi
          # install_name_tool invalidates signatures; Apple Silicon refuses unsigned code.
          codesign --force --deep --sign - "$APP"

      - name: Smoke test
        run: "\"$APP/Contents/MacOS/rich4-portable\" --help"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP" dist/rich4-portable-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: rich4-portable-macos-arm64
          path: dist/rich4-portable-macos-arm64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/steam-ogg-support'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Apple Silicon Mac (macOS 14 or later). Game files are not included: buy Richman 4 on
          [Steam](https://store.steampowered.com/app/2059810/Richman_4/?l=tchinese) and choose its
          install folder when the app asks (see the README).

          The app is not notarized. After unzipping, clear the download quarantine once:

          ```sh
          xattr -dr com.apple.quarantine rich4-portable.app
          ```
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            # Re-running the job for the same tag replaces the zip instead of failing.
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "$tag" --notes-file notes.md
          else
            # Rolling prerelease: one per branch, recreated on the newest commit at every push.
            tag="$GITHUB_REF_NAME-latest"
            gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "$GITHUB_REF_NAME (${GITHUB_SHA::7})" --notes-file notes.md
          fi
          gh release upload "$tag" dist/rich4-portable-macos-arm64.zip --clobber
